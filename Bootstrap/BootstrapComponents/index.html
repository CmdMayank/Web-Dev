<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Components And Navigation</title>
     <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
</head>
<body>
    <div class="container display-4"> Course dashboard</div>

    <button class="btn btn-primary btn-lg m-4 p-3"> Start Courses</button>
    <button class="btn btn-success btn-sm m-4 p-3">Completed</button>
    <button class="btn btn-danger disabled m-4 p-3">Delete</button>

    <br><br>
    <hr>

    <div class="btn-group m-3">
        <button class="btn btn-primary">HTML</button>
        <button class="btn btn-primary">CSS</button>
        <button class="btn btn-primary">BOOTSTRAP</button>
    </div>

    <br><br>
    <hr>

    <button class="btn btn-primary m-3">Message
        <span class="badge text-bg-light">5</span>
    </button>

    <br><br>
    <hr>

    <div>
        Course Status
        <span class="badge text bg-success m-3">Active</span>
    </div>

    
     <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
</body>
</html>
