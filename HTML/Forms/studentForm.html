<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Resignation Form</title>
</head>
<body>
    <h1>Task 4</h1>


    <form>
    <table border="1" width = "100" cellpaddings = "5">
    <tr>
        <th colspan="4">
            <h2>Resignation Form</h2>
        </th>
       </tr>

        <tr>
        <td>Student Name</td>
        <td>
            <input type="text" placeholder="First Name">
        </td>
        <td>
            <input type="text" placeholder="Middle Name">
        </td>
        <td>
            <input type="text" placeholder="Last Name">
        </td>
    </tr>

    <tr>
        <td>Father's Name</td>
        <td>
            <input type="text" placeholder="Enter your father's Name">
        </td>
        <td>Mother's Name</td>
        <td>
            <input type="text" placeholder="Enter your Mother's Name">
        </td>
    </tr>


    <tr>
        <td>Date of Birth</td>
        <td>
            <input type="date">
        </td>
        <td>Gender</td>
        <td>
            <input type="radio" name="gender"> Male
            <input type="radio" name="gender"> Female
        </td>
    </tr>

    <tr>
        <td>Category</td>
        <td>
            <input type="radio" name="category"> Gen
            <input type="radio" name="category"> OBC
            <input type="radio" name="category"> SC/ST
        </td>
        <td>Handicapped</td>
        <td>
            <input type="radio" name="handicap"> Yes
            <input type="radio" name="handicap"> No
        </td>
    </tr>


    <tr>
        <td>Ex-Serviceman</td>
        <td>
            <input type="radio" name="ex"> Yes
            <input type="radio" name="ex"> No
        </td>
        <td>EWS</td>
        <td>
            <input type="radio" name="ews"> Yes
            <input type="radio" name="ews"> No
        </td>
    </tr>


     <tr>
        <td>Email ID</td>
        <td>
            <input type="email">
        </td>
        <td>Mobile No.</td>
        <td>
            <input type="text">
        </td>
    </tr>

    <tr>
        <td>State</td>
        <td>
            <select>
                <option>Select any One</option>
                <option>Madhya Pradesh</option>
                <option>Maharashtra</option>
                <option>Rajasthan</option>
            </select>
        </td>

        <td>City</td>
        <td>
            <select>
                <option>Select any One</option>
                <option>Bhopal</option>
                <option>Indore</option>
                <option>Delhi</option>
            </select>
        </td>
    </tr>

    <tr>
        <td>Upload Photo</td>
        <td>
            <input type="file">
        </td>

        <td>Upload Signature</td>
        <td>
            <input type="file">
        </td>
    </tr>

    <tr>
        <td colspan="4" align="center">
            <input type="submit" value="Submit">
        </td>
    </tr>

    </table>
    </form>
</body>
</html>
